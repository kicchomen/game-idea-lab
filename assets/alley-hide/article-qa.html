&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi_cizW7c75fEjxdS8l6_k11X5NOv8UJVu3J005Bto3dKVbw9B1CBQUlrKQhTexA4C_-RhG0nXaH0MHtGTidnhz6yA_V48ZA407N4XieuUtWVOjOgwt2uD5fTYFoOBIO3Xt-_DQhcJDxD_UA_cvcxxo_ewsed07dZuHHnDHoBTA3jIIvUkuquJ4e7MeX70/s1600/image.png&quot; alt=&quot;夕暮れの路地で足音を聞き、隠れた相手を追う子どもの構想イラスト&quot; style=&quot;width:100%;height:auto&quot; /&gt;&lt;/p&gt;
&lt;h2&gt;聞いた場所に、まだいるとは限らない&lt;/h2&gt;
&lt;p&gt;『路地のかくれんぼ』では、足音の方向を聞いて相手を追います。でも、自分が動く間に相手も1歩。少し前の情報から、いまどこにいるかを考えて先回りする遊びです。&lt;/p&gt;
&lt;iframe src=&quot;https://kicchomen.github.io/game-idea-lab/games/alley-hide/&quot; title=&quot;路地のかくれんぼを試遊&quot; width=&quot;100%&quot; height=&quot;670&quot; style=&quot;border:0&quot; loading=&quot;lazy&quot;&gt;&lt;/iframe&gt;
&lt;p&gt;矢印で移動。「聞く」で方向を調べ、「探す」で自分がいるマスを確認します。相手の巡回路は遊び方に表示。8手以内に捕まえましょう。PCは矢印キー・L・Spaceでも操作できます。&lt;/p&gt;
&lt;p&gt;&lt;a href=&quot;https://kicchomen.github.io/game-idea-lab/games/alley-hide/&quot;&gt;別画面で遊ぶ&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;今回の試作は固定の路地と8通りの出発位置だけ。別の街や複数の足音を追う展開は構想段階です。人の初見プレイや長時間の面白さは、まだ確かめていません。&lt;/p&gt;
