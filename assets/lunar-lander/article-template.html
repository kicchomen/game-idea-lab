<p>ゲームアイデアを考え、核になる遊びを試作しました。今回は、月面に近づく着陸船のパイロット。緑の台に向かうだけでは着陸できません。横へ流れる機体に逆向きの力をかけ、接地までに姿勢と速度を整えます。</p>
<figure style="margin:12px 0"><img src="__GUIDE_CDN__" width="1200" height="510" alt="早めに噴射して滞空し、左傾きと噴射で右流れを抑え、水平に戻して緑の台へ降りる流れ" style="width:100%;height:auto;display:block;border-radius:10px" /></figure>
<h2>月面に降りてみる</h2>
<iframe src="https://kicchomen.github.io/game-idea-lab/games/lunar-lander/" title="月面着陸のパイロットを試遊" height="445" style="display:block;width:100%;max-width:100%;border:0;border-radius:10px"></iframe>
<p><a href="https://kicchomen.github.io/game-idea-lab/games/lunar-lander/" target="_blank" rel="noopener">試遊だけを別画面で開く</a></p>
<p><strong>操作：</strong>PCは←／→とスペース。スマホはボタンを長押しし、傾きと噴射を組み合わせます。まず早めに噴射して、台まで飛ぶ時間を稼ぐのがコツ。傾きのボタンを離すと水平に戻ります。台に両脚を収め、下降と横移動の表示を上限以下にして接地できれば成功です。</p>
<p>今回の試遊は一つの着陸場だけ。燃料の少ない機体や、台の位置が違う着陸場は今後の構想です。</p>
