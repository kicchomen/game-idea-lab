<p>ゲームアイデアを考え、遊びの核を試せる形にしました。今回は、雨の町を撮った一枚を仕上げる暗室の見習い。店先、電車、濡れた通りでは、必要な光の量が違います。</p>
<h2>ちょうどいいところで光を遮る</h2>
<p>「照射」を押すと3本のバーが伸びます。白い印に来た区画から、A・B・Cのマスクで光を遮ります。3区画とも「適正」になったら「焼き止め」。光を当てすぎた区画は元に戻せません。</p>
<figure style="margin:0 0 14px"><img src="__GUIDE__" alt="試遊画面。店先・路面電車・通りの写真の下に3本の露光計とマスクボタン" style="display:block;width:100%;max-width:545px;height:auto;margin:auto" /></figure>
<h2>試遊：雨の日の写真暗室</h2>
<p>制限時間は18秒。照射ボタンをもう一度押すと光だけ消せます。今回は一枚だけで、実際の暗室作業を再現するものではありません。</p>
