<!doctype html><html lang="ja"><meta charset="utf-8"><title>深海サルベージ 表示検証</title><style>body{font-family:sans-serif}iframe{display:block;border:1px solid #bbb}</style><label>表示幅 <select id="width"><option>320</option><option>360</option><option>390</option></select> px</label><iframe id="article" title="記事本文の幅検証" width="320" height="1500" srcdoc="&lt;!doctype html&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;style&gt;body{margin:0;padding:0}*{box-sizing:border-box}&lt;/style&gt;&lt;div class=&quot;salvage-article&quot; style=&quot;font-size:16px;line-height:1.85;overflow-wrap:anywhere&quot;&gt;
&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhtdvpLs9vhJHLRsEzKW-8_b_n4xtpoWUgSklOvGXgw75VtfNVV8ZAKLLVp-KJf9Iuoy0RweNhyZS2Ds_lk0Cz3kENOXTtEmxyKMj4-upg43LFvByKy8XBNhTCtu4QfCu5fC5zfEIm6ebqGb9CyNPKoaizCKE6N3H89KwyNu4e1wFGSQpHqyAYfq4Pr_hE/s1600/clipboard.png&quot; width=&quot;1200&quot; height=&quot;800&quot; alt=&quot;深海サルベージ。もう一つ拾うか、母船へ戻るかを迷う潜水士の概念イラスト&quot; style=&quot;display:block;width:100%;height:auto;border-radius:12px&quot; /&gt;&lt;/p&gt;
&lt;p&gt;ゲームアイデアの発案と、遊びの核を試せる小さな試遊の記事です。&lt;/p&gt;
&lt;h2&gt;宝を拾うほど、帰りの酸素が重くなる&lt;/h2&gt;
&lt;p&gt;あなたは海底の宝を回収する潜水士。もう一つ持ち帰りたい。でも荷物が増えると、移動で使う酸素も増える。&lt;strong&gt;拾った宝は、母船まで戻って初めて得点&lt;/strong&gt;になります。&lt;/p&gt;
&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPQnTZ2ij30ybuNZBbzMhYMdX5i2R3nmmVRKEzz30t-yf4ZLGZzPin-ZYDmvNKluzvP9NgvBlZk_SabYMuovVLfw90JDY61b2uqdj_lxakTFuqCO_M8FWl2voNVwd4rApGNCR_6zSWSTOAuL2OaQ4w96U4vD8guQktN0rHhlrhTgZeGJ80UFF43fjd42I/s1600/clipboard.png&quot; width=&quot;900&quot; height=&quot;1350&quot; alt=&quot;宝を拾う、荷物が増えると酸素を多く使う、母船に戻って得点にする、という遊びの流れ&quot; style=&quot;display:block;width:100%;max-width:640px;height:auto;margin:auto;border-radius:12px&quot; /&gt;&lt;/p&gt;
&lt;p style=&quot;font-size:14px;color:#666&quot;&gt;上の画像は企画を説明する生成イラストです。実際の試遊は、地点とルートを選ぶシンプルな画面です。&lt;/p&gt;
&lt;h2&gt;まずは潜ってみる&lt;/h2&gt;
&lt;p&gt;隣の地点を選んで移動し、宝を回収。残りの酸素と「帰還に必要な酸素」を見比べよう。操作するまで時間は進みません。&lt;/p&gt;
&lt;iframe src=&quot;https://kicchomen.github.io/game-idea-lab/games/salvage-diver/&quot; title=&quot;深海サルベージを試遊&quot; width=&quot;100%&quot; height=&quot;1120&quot; style=&quot;display:block;width:100%;border:1px solid #ccdbe1;border-radius:12px&quot; loading=&quot;lazy&quot; allowfullscreen&gt;&lt;/iframe&gt;
&lt;p&gt;&lt;a href=&quot;https://kicchomen.github.io/game-idea-lab/games/salvage-diver/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;試遊を単独画面で開く ↗&lt;/a&gt;&lt;/p&gt;
&lt;ul&gt;&lt;li&gt;スマホ：地点と「回収する」「潜水する」をタップ&lt;/li&gt;&lt;li&gt;PC：クリック、またはTab＋Enter。地点は0〜5、Spaceで回収・出発&lt;/li&gt;&lt;li&gt;3回以内の潜水で目標額を母船へ。酸素切れや目標未達は再挑戦できます&lt;/li&gt;&lt;/ul&gt;
&lt;h2&gt;今回試せること／これから広げたいこと&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;実装済み：&lt;/strong&gt;荷物の重さと酸素の交換、回収前の帰還見込み、積み荷の放棄、3つの条件、成功・失敗・再挑戦。3つ目は浅い宝だけでは目標に届かず、深海金庫への往復が必要です。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;構想：&lt;/strong&gt;遠征先を選び、装備や仲間を育てるサルベージ隊。今回の試作には装備・育成・ランダム海域はありません。&lt;/p&gt;
&lt;p&gt;検証で「同じルートが全条件で通る」点を見直し、最後の条件は深い宝を狙う判断が必要になるよう変更しました。固定ルートなので、初見の分かりやすさや長く遊んだ面白さは、まだ人による確認が必要です。&lt;/p&gt;
&lt;p style=&quot;font-size:14px;color:#666&quot;&gt;これは架空のゲームです。酸素消費や潜水の表現は実際の潜水手順ではありません。&lt;/p&gt;
