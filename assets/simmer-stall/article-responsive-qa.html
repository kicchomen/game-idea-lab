&lt;figure style=&quot;margin:0 0 1em;&quot;&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjyus6JOneY9UlH5794V-4y8k4WLyqll-bGkyEEmSmkCfLDOyDwqlbzDTMtG-jH8EbjXf0aZ6fmrmp1C6WzNilREqrLgOm4ml5i4YEDZxnpCfNVcQmDE6I5FbxJby9tm8FO2pbYcZfS5khN-8GjSH6jGjS6tfadDRr9wHNfDXiENgtB2mw0PK7q4AUITH8/s1600/clipboard.jpeg&quot; alt=&quot;ひとつの火で三品の食べ頃をそろえる屋台の鍋番のイメージ&quot; width=&quot;1439&quot; height=&quot;810&quot; style=&quot;display:block;width:100%;height:auto;&quot;/&gt;&lt;figcaption style=&quot;font-size:.85em;color:#666;&quot;&gt;ゲームアイデアのイメージイラスト&lt;/figcaption&gt;&lt;/figure&gt;
&lt;p&gt;ゲームアイデアを発案し、遊びの核を試作してみる記事です。&lt;/p&gt;
&lt;h2&gt;ひとつの火で、三品をそろえる&lt;/h2&gt;
&lt;p&gt;大根はじっくり。葉物はさっと。あなたは小さな屋台の鍋番です。&lt;/p&gt;
&lt;p&gt;火を強めると、鍋の中の食材が全部いっしょに煮えていく。でも先に取り出したものは冷めてしまう。&lt;strong&gt;「いつ入れるか」と「いつ出すか」を組み合わせ、三品が食べ頃の一皿を作る&lt;/strong&gt;ゲームです。&lt;/p&gt;
&lt;h2&gt;小さく試してみる&lt;/h2&gt;
&lt;p&gt;今回の試作は、大根・じゃがいも・葉物で三皿を仕上げるところまで。食べ頃と温かさを満たした皿が、三皿中二皿以上なら成功です。&lt;/p&gt;
&lt;figure style=&quot;margin:1em 0;&quot;&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhjJHb9L3Pfc883SsiXuJMoHSuHxsRZ_68IvybtVFkk3zO-aIScd7YsrGxIuTv-6Xp9VxPGu04VLaI8-xY6HbUyuMK41f2LpTyLTgRlqVNaX1aXXV5P3Nj0TdYaBYA2Lf9NcLK6KeZxxes5bgzQH36EKVwHtcOlJVVzcASlGyGEGlAnIpRqwnhpFc1EKZs/s1600/clipboard.jpeg&quot; alt=&quot;実際の試作画面。大根を先に煮て、あとからじゃがいもを加えたところ&quot; width=&quot;460&quot; height=&quot;740&quot; style=&quot;display:block;width:100%;max-width:460px;height:auto;margin:auto;&quot;/&gt;&lt;figcaption style=&quot;font-size:.85em;color:#666;&quot;&gt;実際の試作画面。投入時刻をずらすと、火入れの差を調節できます。&lt;/figcaption&gt;&lt;/figure&gt;
&lt;iframe src=&quot;https://kicchomen.github.io/game-idea-lab/games/simmer-stall/&quot; title=&quot;屋台の鍋番を試遊&quot; width=&quot;100%&quot; height=&quot;920&quot; style=&quot;border:0;width:100%;max-width:100%;display:block;&quot; loading=&quot;lazy&quot;&gt;&lt;/iframe&gt;
&lt;p&gt;&lt;a href=&quot;https://kicchomen.github.io/game-idea-lab/games/simmer-stall/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;単独の画面で試遊する ↗&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;食材ボタンで投入・取り出し、共通の火を弱火／強火／停止で調節。三品を盛り付けたら提供します。取り出しはやり直せないので、適正範囲の表示を見ながら、必要なときは一時停止をどうぞ。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;ヒント：&lt;/strong&gt;最初は大根から。残りの二品は、同時に入れなくてもいいんです。&lt;/p&gt;
&lt;h2&gt;この先に広げるなら&lt;/h2&gt;
&lt;p&gt;注文を引き受けるか選んだり、二人で調理と配膳を分担したりする屋台運営へ。今回はその構想のうち、&lt;strong&gt;共通の火と投入時差を使う一皿の工程&lt;/strong&gt;だけを実装しています。固定の三注文なので、覚えたあとも遊び続けたくなるかは、まだ検証が必要です。&lt;/p&gt;
&lt;p style=&quot;font-size:.9em;color:#666;&quot;&gt;自動テストとブラウザ操作で動作を確認し、低い描画頻度で進行が遅れる問題を修正しました。スマートフォン実機、人の初見テスト、長く遊ぶ面白さは未検証です。&lt;/p&gt;
