&lt;p>今回は、庭に線を引いて花壇を広げるゲームアイデアと、その核を試せるプロトタイプを紹介します。&lt;/p>
&lt;h2>広く囲みたい。でも、線はまだ安全じゃない。&lt;/h2>
&lt;p>あなたは星庭の庭師。安全な縁から草地へ歩き、線を伸ばします。安全な場所へ戻ると、&lt;strong>線と、虫のいない側が花壇に変わります。&lt;/strong>&lt;/p>
&lt;p>未完成の線に虫が触れると、線が消えて出発点へ。小さく閉じるか、もう少し広く狙うか。自分が広げた花壇が、次の出発点になります。&lt;/p>
&lt;figure style=&quot;margin:18px auto;text-align:center&quot;>&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjb8zKbTRG_sYPMcAWrriyLVIzztgb5mWJmzp0JFIjYKJSIiLYplH5BcQEf7lFWIiGsRmBUhjR02QB4pSM2SixoZD4T2pnyodSidES4oQl0DpGYVPzzhCcy-iWeRfWJxoxqWkggm3CFxoBiO0ON1ZRHSEaP5yMX2SNuwcNqzmdgbiCXtX4Kz8zwyZ6aZIM/s1600/clipboard.jpeg&quot; alt=&quot;星庭の囲い番の実際の試遊画面。黄色の線を伸ばし、虫の位置と向きを読む&quot; style=&quot;width:100%;max-width:390px;height:auto&quot;>&lt;figcaption>試作の実画面。冒頭は構想イラストです。&lt;/figcaption>&lt;/figure>
&lt;h2>虫の向きを見て、一歩ずつ&lt;/h2>
&lt;iframe src=&quot;https://kicchomen.github.io/game-idea-lab/games/star-garden/?v=20261113b&quot; title=&quot;星庭の囲い番の試遊&quot; style=&quot;display:block;width:100%;height:600px;border:0;border-radius:12px&quot; loading=&quot;lazy&quot;>&lt;/iframe>
&lt;p>&lt;a href=&quot;https://kicchomen.github.io/game-idea-lab/games/star-garden/?v=20261113b&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>別画面で試遊する&lt;/a>&lt;/p>
&lt;p>画面の矢印、矢印キー、WASDで移動。1歩進むと虫も1歩動きます。虫は矢印の方向へ進み、塞がると右回りに進める方向を探します。操作しない間は動かないので、ゆっくり考えられます。&lt;/p>
&lt;p>49マス中36マスを花壇にすれば成功。♥を3つ失うか80手で終了です。引いた線は1歩ずつ戻せますが、横切れません。「再挑戦」で最初からやり直せます。&lt;/p>
&lt;h2>今回の試作と、この先&lt;/h2>
&lt;p>実装したのは固定の庭1面と虫1匹。線を閉じて安全域を増やす部分だけを切り出しました。同じ手順を覚えれば攻略でき、長く遊ぶための変化はまだありません。&lt;/p>
&lt;p>構想では庭の形や虫の動き、残したい区画を変え、広げる順序に幅を持たせます。これらは未実装です。実機スマートフォン、人の初見テスト、長期的な面白さも未検証です。&lt;/p>&lt;/div>"></iframe><iframe title="360px記事" width="360" height="900" srcdoc="&lt;!doctype html>&lt;meta charset=utf-8>&lt;meta name=viewport content=width=device-width>&lt;style>body{margin:0;font-family:system-ui}&lt;/style>&lt;div style=&quot;max-width:760px;margin:auto;line-height:1.85;overflow-wrap:anywhere&quot;>
