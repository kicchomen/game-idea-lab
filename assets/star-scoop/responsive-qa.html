<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星すくい 表示確認</title><style>body{font:16px system-ui;background:#eee;color:#222;margin:16px}button,input{font:inherit;min-height:44px;margin:4px}input{width:min(90vw,650px)}iframe{display:block;border:0;background:#171d3d;margin-top:12px}#stage{overflow:auto;max-width:100%}</style><h1>表示枠の確認</h1><p>URLは保存・ログ・履歴変更しません。秘密URLを記録へ転記しないでください。</p><input id="url" type="url" placeholder="プレビューURL（このページ内だけで使用）" autocomplete="off"><button id="load">URLを表示</button><button id="game">試遊へ戻す</button><div id="sizes"></div><p id="size"></p><div id="stage"><iframe id="frame" title="表示確認" src="../../games/star-scoop/" width="320" height="568"></iframe></div><script>const f=document.getElementById('frame');for(const [w,h] of [[320,568],[360,640],[390,844],[258,568],[667,375]]){const b=document.createElement('button');b.textContent=w+' × '+h;b.onclick=()=>{f.width=w;f.height=h;document.getElementById('size').textContent=b.textContent;};document.getElementById('sizes').append(b)}document.getElementById('load').onclick=()=>{try{const u=new URL(document.getElementById('url').value);if(u.protocol==='https:')f.src=u.href;}catch{alert('httpsのURLを入力してください')}};document.getElementById('game').onclick=()=>{f.src='../../games/star-scoop/';document.getElementById('url').value='';};</script></html>
