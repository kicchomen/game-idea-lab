<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風読みの小さなヨット・表示検査</title><style>body{margin:16px;background:#e9eef0;color:#15394b;font:14px system-ui,sans-serif}h1{font-size:20px}button,input{font:inherit;min-height:44px;margin:3px}button{padding:8px 12px}input{width:80px}#url{width:min(100%,650px);min-width:180px}nav{display:flex;flex-wrap:wrap;align-items:center}iframe{display:block;border:2px solid #17475b;box-sizing:content-box;background:#0c3546}p{max-width:650px}#size{font-weight:bold}</style></head><body><h1>風読みの小さなヨット・表示検査</h1><p>埋め込みのCSS幅・高さを変えて通常操作を確認する検査用ページです。ゲームの状態は操作しません。記事テーマ全体や物理スマートフォンの検査ではありません。</p><nav aria-label="表示領域"><button data-size="320,568">320 × 568</button><button data-size="360,640">360 × 640</button><button data-size="390,844">390 × 844</button><button data-size="258,568">258 × 568</button><button data-size="667,375">667 × 375</button></nav><p><label>幅 <input id="width" type="number" min="240" max="1200" value="320"></label><label>高さ <input id="height" type="number" min="320" max="1000" value="568"></label><button id="apply">適用</button></p><p><label for="url">検査するURL（任意）</label><br><input id="url" type="url" autocomplete="off" spellcheck="false" placeholder="既定は試遊。許可された記事・プレビューURLを入力"><button id="apply-url">URLを適用</button><button id="reset-url">試遊へ戻す</button></p><p id="url-status" role="status">現在の対象：試遊</p><p id="size" aria-live="polite">試遊の表示領域：320 × 568 CSS px</p><iframe id="trial" src="../../games/windward-sail/" title="風読みの小さなヨットを表示検査" width="320" height="568"></iframe><p><a href="../../games/windward-sail/">単独の試遊を開く</a></p><script>const frame=document.getElementById('trial'),w=document.getElementById('width'),h=document.getElementById('height');function apply(){const width=Math.max(240,Math.min(1200,Number(w.value)||320)),height=Math.max(320,Math.min(1000,Number(h.value)||568));w.value=width;h.value=height;frame.width=width;frame.height=height;document.getElementById('size').textContent='試遊の表示領域：'+width+' × '+height+' CSS px';}for(const b of document.querySelectorAll('[data-size]'))b.addEventListener('click',()=>{[w.value,h.value]=b.dataset.size.split(',');apply()});document.getElementById('apply').addEventListener('click',apply);const urlField=document.getElementById('url'),urlStatus=document.getElementById('url-status');document.getElementById('apply-url').addEventListener('click',()=>{try{const u=new URL(urlField.value);if(u.protocol!=='https:'||u.username||u.password||u.port||!((u.hostname==='game-idea-lab.blogspot.com')||(u.hostname==='kicchomen.github.io'&&u.pathname.startsWith('/game-idea-lab/'))))throw Error();frame.src=u.href;urlStatus.textContent='指定した記事・プレビューを表示しています。URLは保存しません。';urlField.value='';}catch{urlStatus.textContent='このブログ、または既存GitHub PagesのHTTPS URLを入力してください。';}});document.getElementById('reset-url').addEventListener('click',()=>{frame.src='../../games/windward-sail/';urlField.value='';urlStatus.textContent='現在の対象：試遊';});</script></body></html>
