<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="description" content="床と天井を重力反転で走る、短い宇宙ステーション点検ゲーム。">
<title>天井走りの点検ロボ | ゲームアイデア実験室</title>
<link rel="stylesheet" href="style.css?v=1"><script defer src="engine.js?v=1"></script><script defer src="app.js?v=1"></script>
</head><body><main class="machine" aria-labelledby="title">
  <header><div class="eyebrow"><span></span> STATION 07 / 点検通路</div><h1 id="title">天井走りの点検ロボ</h1></header>
  <section class="status" aria-label="走行状況">
    <div class="status-item"><span>点検回収</span><strong id="marks">0 <small>/ 6</small></strong></div>
    <div class="status-item mile"><span>整備ドックまで</span><progress id="distance" aria-label="走行の進み具合" max="1040" value="0"></progress></div>
    <div class="status-item gravity"><span>引力</span><strong id="gravity">↓ <small>床へ</small></strong></div>
  </section>
  <div class="view">
    <canvas id="rail" width="640" height="284" aria-label="宇宙ステーションの床と天井を横から見た点検通路"></canvas>
    <div id="overlay" class="overlay"><p id="state" role="status" aria-live="polite"><b>整備ドックを目指せ</b><span>◆を4つ以上集めて到着</span></p></div>
  </div>
  <div class="actions">
    <button id="primary" class="primary" type="button">点検を始める</button>
    <button id="secondary" class="secondary" type="button" disabled>一時停止</button>
  </div>
  <p id="help">走行中：タップ / Space で反転。レールに着くと再び反転。</p>
</main></body></html>
