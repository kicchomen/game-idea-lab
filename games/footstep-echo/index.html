<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>足あとエコー｜ゲームアイデア実験室</title><link rel="stylesheet" href="style.css?v=2"><main><header><p class="eyebrow">GAME IDEA LAB / EXPERIMENT 02</p><h1>足あとエコー<span>4歩前の自分と、協力する。</span></h1></header><div class="levelbar"><span id="levelName"></span><span id="turnCount">0 歩</span></div><p class="intro">黄＝自分　青＝4歩前の残像<br>青が丸いスイッチに乗ると、扉が開きます</p><div id="board" role="img" aria-label="パズルの盤面"></div><p id="status" role="status" aria-live="polite"></p><div id="timeline" aria-label="これから残像がたどる4歩"></div><p class="caption">足あとの数字は、何歩後に残像が来るか</p><div class="controls" aria-label="移動ボタン"><button class="left" data-move="-1,0" aria-label="左へ">←</button><button class="up" data-move="0,-1" aria-label="上へ">↑</button><button class="wait" data-move="0,0">待つ</button><button class="down" data-move="0,1" aria-label="下へ">↓</button><button class="right" data-move="1,0" aria-label="右へ">→</button></div><div class="actions"><button id="undo">1歩戻す</button><button id="reset">やり直す</button><button id="hint">ヒント</button></div><p id="hintText" hidden></p><button id="next" hidden>次の部屋へ →</button><p class="footer">時間制限なし。壁への移動は歩数に数えません<br>矢印キー／Spaceでも遊べます</p></main><script src="engine.js?v=2"></script><script src="game.js?v=2"></script></html>
