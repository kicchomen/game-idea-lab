<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<meta name="description" content="指向性マイクを回して、夜の森にいる鳥の声の方角を探す短いゲーム。">
<title>夜の森の音さがし</title><link rel="stylesheet" href="style.css">
</head><body>
<main aria-labelledby="title">
  <header><h1 id="title">夜の森の音さがし</h1><p>マイクを回して、鳴き声の方角を探す</p></header>
  <div class="hud">
    <div class="pill round">観測 <strong id="round">1 / 2</strong></div>
    <div class="pill clock">残り <strong id="time">20</strong> 秒</div>
  </div>
  <section id="arena" aria-label="指向性マイクのレーダー">
    <canvas id="radar" width="864" height="790" role="img" aria-label="方位とマイクの方向"></canvas>
    <div id="notice" hidden><div><strong id="notice-title"></strong><p id="notice-copy"></p></div></div>
  </section>
  <div id="signal-row">
    <span id="signal-label">鳴き声の強さ</span>
    <span id="signal" role="meter" aria-labelledby="signal-label" aria-valuemin="0" aria-valuemax="12" aria-valuenow="7"></span>
  </div>
  <div id="controls" role="group" aria-label="マイクを操作">
    <button id="left" type="button" aria-keyshortcuts="ArrowLeft" title="左へ（←）" disabled>左へ</button>
    <button id="action" type="button" aria-keyshortcuts="Enter" title="開始・記録・次へ（Enter）">はじめる</button>
    <button id="right" type="button" aria-keyshortcuts="ArrowRight" title="右へ（→）" disabled>右へ</button>
  </div>
  <p id="guide">音なしでも遊べます</p>
  <p id="status" class="sr" role="status" aria-live="polite">中央ボタンで観測を開始。左右キーとEnterでも操作できます。</p>
</main>
<script src="engine.js"></script><script src="app.js"></script>
</body></html>
