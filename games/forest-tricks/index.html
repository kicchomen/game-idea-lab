<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森の切り札便</title><link rel="stylesheet" href="style.css"><body><main><header><h1><span>❧</span> 森の切り札便 <span>☙</span></h1><button id="help" aria-label="遊び方">?</button></header><section id="bids" aria-label="勝ち数の予想"><label>予想</label><div class="bid-row"></div></section><section id="table" aria-label="勝負の場"><div class="stats"><span id="trump"></span><span id="progress"></span><span id="score"></span></div><div class="duel"><div><small>あなた</small><div id="player-card" class="slot">?</div></div><strong>VS</strong><div><small>相手</small><div id="opponent-card" class="slot">?</div></div></div><p id="message" role="status" aria-live="polite"></p></section><div class="hand-label">あなたの手札 <small id="hint"></small></div><section id="hand" aria-label="手札"></section><div id="actions"></div><footer><button id="retry">同じ便をやり直す</button><button id="new">別の便</button></footer></main><dialog id="rules"><h2>遊び方</h2><p>5回の勝負で、自分が勝つ回数を先に予告。ぴったりなら成功です。</p><ol><li>先に出た札と同じ色を持っていれば、その色を出します。</li><li>切り札の色が優先。同じ色同士なら大きい数字が勝ちます。</li><li>別の色同士で切り札がなければ、先に出した側が勝ちます。</li><li>勝った側が次の先手。相手は勝てる中で最も弱い札、無理なら最も弱い札を出します（切り札を温存）。</li></ol><p>葉・雫の各1〜7から5枚ずつ配ります。残り4枚は不使用。時間制限なし。手札は数字キー1〜5、その他はTab・Enterでも操作できます。</p><button id="close">閉じる</button></dialog><script src="engine.js"></script><script src="app.js"></script></body></html>
