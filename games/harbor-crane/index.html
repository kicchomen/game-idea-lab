<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>港のクレーン係｜試遊</title><link rel="stylesheet" href="style.css"><main><header><p class="eyebrow">GAME IDEA LAB · PROTOTYPE</p><h1>港のクレーン係</h1><p>運ぶ。揺れを整える。狙って離す。</p></header><div class="hud"><strong id="job">仕事 1 / 3</strong><span id="time">残り40秒</span><button id="pause" disabled>一時停止</button></div><canvas width="520" height="370" aria-label="クレーンと吊荷、目標の荷台。下の丸は予測着地点です。"></canvas><div class="telemetry"><span id="aim">着地点：―</span><span id="sway">横の勢い：―</span></div><p id="status" role="status" aria-live="polite">左右で運び、丸が荷台に重なったら離そう。</p><div class="controls"><button id="left" aria-label="左へ運ぶ">◀ 左へ</button><button id="release">離す</button><button id="right" aria-label="右へ運ぶ">右へ ▶</button></div><div class="actions"><button id="start">仕事を始める</button><button id="retry" hidden>この仕事をやり直す</button><button id="next" hidden>次の仕事へ</button><button id="again" hidden>最初から遊ぶ</button></div><details><summary>操作とルール</summary><p>左右ボタンを押し続けるか、← → / A D で台車を移動。離す（Space）と箱は落下し、やり直せません。</p><p>荷台に箱全体が収まり、横の勢いが32以下なら成功。着地点の丸と勢い表示が両方緑のときが目安です。各仕事40秒。失敗しても同じ仕事から再挑戦できます。</p><p>P / Esc で一時停止。別画面へ移ると停止します。実機クレーンとは異なる、簡略化した物理の試作です。</p></details></main><script src="engine.js"></script><script src="app.js"></script></html>
