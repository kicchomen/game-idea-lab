<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>月面着陸のパイロット</title>
<link rel="stylesheet" href="style.css?v=ui3">
</head><body>
<main id="mission" data-mode="ready">
  <header>
    <div class="heading"><div class="mission-tag">MISSION 01</div><h1>月面着陸のパイロット</h1></div>
    <button id="pause" type="button" disabled aria-label="一時停止">一時停止</button>
  </header>
  <dl class="telemetry" aria-label="機体の状態">
    <div><dt>燃料</dt><dd><span id="fuel">100%</span></dd></div>
    <div><dt>下降</dt><dd><span id="down" aria-describedby="down-limit">1</span><small id="down-limit">16以下</small></dd></div>
    <div><dt>横移動</dt><dd><span id="side" aria-describedby="side-limit">→21</span><small id="side-limit">10以下</small></dd></div>
  </dl>
  <section id="arena" aria-label="月面の着陸場">
    <canvas id="scene" width="780" height="456" aria-hidden="true"></canvas>
    <div id="panel">
      <div id="prompt">
        <strong id="headline">緑の台に、そっと降りよう</strong>
        <p id="message">推進で下降を抑え、<wbr>緑の台を目指そう。</p>
        <button id="action" type="button">着陸を始める</button>
      </div>
    </div>
  </section>
  <div id="controls" role="group" aria-label="飛行操作">
    <button type="button" data-hold="left" aria-label="左に傾ける"><span aria-hidden="true">◀</span> 左傾き</button>
    <button type="button" data-hold="thrust" aria-label="エンジンを噴射" id="burn"><span aria-hidden="true">⬆</span> 噴射</button>
    <button type="button" data-hold="right" aria-label="右に傾ける">右傾き <span aria-hidden="true">▶</span></button>
  </div>
  <p id="guide">長押し：傾き＋噴射で横に加速<br>キーボード：← → ＋ Space</p>
  <p id="state" role="status" class="sr"></p>
</main>
<script src="engine.js?v=ui3"></script><script src="app.js?v=ui3"></script>
</body></html>
