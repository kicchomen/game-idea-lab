<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102d36">
<title>朝市の雪かき番</title>
<link rel="stylesheet" href="style.css">
<script defer src="engine.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main class="game">
<header><div><span class="kicker">ゲームアイデア実験室 / PLAYABLE</span><h1>朝市の雪かき番</h1></div><button id="pause" type="button" aria-label="一時停止">Ⅱ</button></header>
<section class="stats" aria-label="現在の状況">
  <div><small>開店まで</small><strong id="time">38<small>秒</small></strong></div>
  <div><small>残りの雪</small><strong id="remaining"></strong></div>
  <div><small>荷台</small><strong id="cargo"></strong></div>
</section>
<section class="playfield" aria-label="朝市の通路">
  <canvas id="board" tabindex="-1" width="420" height="420" aria-label="見下ろしの朝市マップ"></canvas>
  <div id="overlay" class="overlay">
    <div class="card">
      <p class="eyebrow" id="label">開店前の38秒</p>
      <h2 id="heading">雪を積んで、捨てる。</h2>
      <p id="description">矢印で走ると雪が荷台に。青い排雪口で「排雪」。全部拾い、最後の荷台も空にしよう。</p>
      <button id="primary" type="button">スタート</button>
      <button id="secondary" type="button" hidden>やり直す</button>
    </div>
  </div>
</section>
<div class="key" aria-hidden="true"><span class="thin">●</span> 薄雪1枠 <span class="deep">◆</span> 深雪2枠 <span class="grate">▤</span> 排雪口</div>
<div class="controls" aria-label="操作">
  <button type="button" data-dir="left" aria-label="左">←</button>
  <button type="button" data-dir="up" aria-label="上">↑</button>
  <button type="button" data-dir="down" aria-label="下">↓</button>
  <button type="button" data-dir="right" aria-label="右">→</button>
  <button type="button" id="dump">排雪</button>
</div>
<p id="feedback" class="feedback" role="status" aria-live="polite">PC：矢印 / WASD、排雪：E</p>
</main>
</body>
</html>
