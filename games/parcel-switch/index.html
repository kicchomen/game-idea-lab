<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小包の分岐番｜荷物の分かれ道</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><header><h1>小包の分岐番</h1><p>分岐を切り替えて、同じ印の箱へ。</p></header><section class="stats" aria-label="配送状況"><span id="score">お届け 0 / 18</span><span id="mistakes">ミス 0 / 3</span></section><section class="board" aria-label="配送ベルト"><svg viewBox="0 0 300 330" role="img" aria-label="上の入口から分岐1へ。左は赤い星の箱。右の分岐2から左は青い丸、右は金色の三角の箱。"><defs><pattern id="belt" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#173e56"/><path d="M0 2H18" stroke="#315770" stroke-width="3"/></pattern></defs><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M130 12V135 L45 210V286 M130 135L205 205 L150 286 M205 205L260 286" stroke="#102e42" stroke-width="32"/><path d="M130 12V135 L45 210V286 M130 135L205 205 L150 286 M205 205L260 286" stroke="url(#belt)" stroke-width="25"/><path id="route1" stroke="#f9df97" stroke-width="5"/><path id="route2" stroke="#f9df97" stroke-width="5"/></g><g class="depots"><rect x="10" y="280" width="70" height="43" rx="10" fill="#c94b35"/><rect x="115" y="280" width="70" height="43" rx="10" fill="#126bb0"/><rect x="225" y="280" width="70" height="43" rx="10" fill="#a86c00"/><text x="45" y="310">★</text><text x="150" y="310">●</text><text x="260" y="310">▲</text></g><g class="forklabels"><circle cx="130" cy="135" r="14"/><text x="130" y="140">1</text><circle cx="205" cy="205" r="14"/><text x="205" y="210">2</text></g><g id="parcels"></g></svg><div id="overlay" class="overlay"><h2 id="overlayTitle">仕分け係、出番です</h2><div id="overlayText"><p>荷物の <b>★ ● ▲</b> を見て、同じ印の箱へ。</p><p>下の <b>分岐1・2</b> を押すと進む向きが変わります。</p><p>分岐を通過した荷物は戻せません。<br>18個届けるまでに、ミス3回で終了。</p></div><button id="start" class="primary">はじめる</button></div></section><aside class="controls"><div class="switches"><button id="switch1" aria-label="分岐1を切り替える"><small>分岐1 <kbd>1</kbd></small><strong id="direction1">↙ ★ へ</strong></button><button id="switch2" aria-label="分岐2を切り替える"><small>分岐2 <kbd>2</kbd></small><strong id="direction2">↙ ● へ</strong></button></div><p id="feedback" role="status" aria-live="polite">準備ができたら、はじめる</p><div class="utility"><button id="pause">一時停止</button><button id="restart">やり直す</button></div></aside></main><script src="engine.js"></script><script src="app.js"></script></body></html>
