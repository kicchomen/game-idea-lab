<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小さな修理工房</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game">
<header><div><small>REPAIR WORKSHOP</small><h1>小さな修理工房</h1></div><button id="help" aria-label="遊び方">？</button></header>
<div class="status"><b id="progress">1 / 3 台目</b><span>検査 あと <strong id="remaining">4</strong> 回</span><span>故障 <b>2</b> 個</span></div>
<section class="bench" aria-label="ロボットの6つの部品"><div class="robot" aria-hidden="true"><i></i><span>●　●</span><em>—</em></div><div id="parts" class="parts"></div></section>
<p id="message" role="status" aria-live="polite">部品を選んで、故障を見つけよう。</p>
<div class="actions"><button id="test">選んで検査</button><button id="repair">2個を交換</button></div>
<section class="log" aria-label="検査結果"><div class="log-head"><b>検査メモ</b><span>選んだ中の故障数</span></div><ol id="logs"></ol></section>
<footer>1〜3個を選んで検査。故障の2個を交換。</footer>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-content"><small id="dialog-label">WORKSHOP</small><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></div></dialog>
<script src="engine.js"></script><script src="app.js"></script></body></html>
