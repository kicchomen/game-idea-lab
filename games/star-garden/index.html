<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星庭の囲い番</title><link rel="stylesheet" href="style.css?v=20261113b"><main><h1>✦ 星庭の囲い番</h1><p class="lead">線を伸ばして帰ろう。虫のいない側が花壇に。</p><div class="hud"><span id="area"></span><span id="steps"></span><span id="lives"></span></div><div class="board" id="board" role="img" aria-label="9×9の庭。白い駒が庭師、金色が虫、黄色の線が未完成の囲い。"></div><p id="message" role="status" aria-live="polite"></p><div class="controls"><button data-dir="left" aria-label="左へ">←</button><button data-dir="up" aria-label="上へ">↑</button><button data-dir="down" aria-label="下へ">↓</button><button data-dir="right" aria-label="右へ">→</button></div><div class="tools"><button id="restart">↻ 再挑戦</button><button id="help">遊び方</button></div><dialog id="rules"><h2>囲って、花壇を広げよう</h2><p>外周と青緑の花壇は安全。そこから草地へ線を引き、安全な場所へ戻ると、線と虫のいない側が花壇になります。</p><p>49マス中36マスで成功。1歩ごとに虫も1歩。虫は矢印へ進み、進めない時は右回りに進める方向を探します。虫が未完成の線に触れると♥を失い、出発点に戻ります。♥3個を失うか80手で終了。</p><p>矢印キー／WASD／画面の矢印で移動。同じ線は1歩ずつ引き返せますが、横切れません。壁への入力は手数になりません。固定の庭を試す小さな試作です。</p><button id="close">庭へ戻る</button></dialog></main><script src="engine.js?v=20261113b"></script><script src="app.js?v=20261113b"></script></html>
