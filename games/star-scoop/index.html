<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雲間の星すくい</title><link rel="stylesheet" href="style.css?v=1"></head><body><main id="game">
<header><h1>雲間の星すくい</h1><button id="help" aria-label="遊び方">？</button></header>
<div class="hud"><span id="night"></span><strong id="bank"></strong></div>
<section class="sky" aria-label="星をすくう夜空"><div class="stars">✦ · ✧ · ✦</div><div id="token" aria-hidden="true">☾</div><div class="boat" aria-hidden="true">◡</div><p id="message" role="status" aria-live="polite"></p></section>
<div class="cargo"><span>今夜 <strong id="catch">0</strong> 点</span><span>雨雲 <strong id="clouds">0 / 2</strong></span></div>
<div class="remaining"><p id="bag"></p><p id="risk"></p></div>
<div class="actions"><button id="draw">すくう</button><button id="bankAction">帰る</button></div>
<div id="roundActions"><button id="advance">はじめる</button></div>
<div class="bottom"><span id="history"></span><button id="pause">中断</button></div>
<dialog id="dialog"><h2 id="dialogTitle" tabindex="-1"></h2><div id="dialogBody"></div><button id="closeDialog">戻る</button><div id="resetActions"><button id="retry">同じ空で最初から</button><button id="fresh">別の空で最初から</button></div></dialog>
</main><script src="engine.js?v=1"></script><script src="app.js?v=1"></script></body></html>
