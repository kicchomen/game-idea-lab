<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岩壁のふたつの手</title><link rel="stylesheet" href="style.css"><main><h1>岩壁のふたつの手</h1><p class="lead">残した手を支点に、次の突起へ。</p><div class="hud"><span id="energy"></span><span id="moves"></span><span id="shelf"></span></div><div class="hands"><button id="left">左手を動かす [L]</button><button id="right">右手を動かす [R]</button></div><div id="wall" aria-label="5列7段の岩壁"></div><p id="message" role="status" aria-live="polite"></p><div class="tools"><button id="rest">棚で休む</button><button id="retry">再挑戦</button><button id="help">遊び方</button></div><dialog id="rules"><h2>両手を頂上へ</h2><p>左手・右手を選び、明るい突起を押します。突起の数字は消費する握力です。残した手から縦1段以内、縦横合わせて3マス以内が届く範囲です。同じ突起は両手で持てません。</p><p>1回で握力2、距離3なら3を消費。中央の休憩棚に両手を置くと、一度だけ握力8に戻せます。握力が尽きると落下。ただし棚で休める時と頂上成功は除きます。</p><p>L/Rで手の選択、Tabで突起へ移動しEnter/Spaceでつかみます。時間は操作した時だけ進みます。固定壁の試作で、現実の登山技術や安全を再現するものではありません。</p><button id="close">閉じる</button></dialog></main><script src="engine.js"></script><script src="app.js"></script></html>
