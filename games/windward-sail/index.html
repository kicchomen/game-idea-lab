<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>風読みの小さなヨット</title><link rel="stylesheet" href="style.css"></head><body><main id="game"><header><div><span class="eyebrow">WINDWARD SAIL · 小さな試作</span><h1>風読みの小さなヨット</h1></div><button id="help" aria-label="遊び方">?</button></header><section class="hud" aria-label="航海の状況"><div><small>残り</small><b id="time">60.0秒</b></div><div><small>次の目印</small><b id="goal">ブイ 1</b></div><div><small>風は北から</small><b>↓ 南へ</b></div></section><div id="sea"><canvas id="chart" width="400" height="500" aria-label="上から見た湾。北から風、上のブイ1、右のブイ2、下の港の順に接近します。"></canvas><div id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="card"><span class="eyebrow">風を読んで、切り返す。</span><h2 id="dialog-title"></h2><p id="dialog-copy"></p><button id="primary"></button><button id="retry" class="secondary">最初からやり直す</button></div></div></div><div id="feedback" role="status"><strong id="sailing">正面の風では進めない</strong><span id="speed">船首 北 0° · 速さ 0</span></div><nav aria-label="操船"><button id="left" aria-label="左へ舵を切る">↶ <span>左へ</span></button><button id="pause">Ⅱ <span>一時停止</span></button><button id="right" aria-label="右へ舵を切る">↷ <span>右へ</span></button></nav><footer>左右を押す間だけ旋回。離すと、その向きへ進む。</footer></main><script src="engine.js"></script><script src="app.js"></script></body></html>
