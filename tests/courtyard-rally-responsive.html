<!doctype html><html lang="ja"><meta charset="utf-8"><title>Courtyard Rally responsive review</title><style>body{margin:12px;font:14px system-ui;background:#ddd}button,input{font:inherit;margin:3px;padding:8px}input{width:650px;max-width:90vw}iframe{display:block;border:0;background:white}header{margin-bottom:8px}</style><header><label>URL <input id="url" value="../games/courtyard-rally/"></label><button id="load">表示</button><br><button data-size="320,568">320×568</button><button data-size="360,640">360×640</button><button data-size="390,700">390×700</button><button data-size="258,568">258×568</button><button data-size="667,375">667×375</button><button data-size="800,700">800×700</button><span id="size">320×568</span></header><iframe id="subject" title="検証対象" src="../games/courtyard-rally/" width="320" height="568"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#load').onclick=()=>{const u=new URL(document.querySelector('input').value,location.href);if(u.protocol==='https:'||u.origin===location.origin)f.src=u.href;};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');f.width=w;f.height=h;document.querySelector('#size').textContent=w+'×'+h;});</script></html>
