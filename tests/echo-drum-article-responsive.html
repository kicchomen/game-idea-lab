<!doctype html><meta charset="utf-8"><title>Saved article responsive QA</title><style>body{margin:0;background:#eee}main{display:flex;gap:8px}iframe{border:0;background:white}</style><h1>保存本文の表示確認</h1><main><section><h2>320px</h2><iframe title="記事320px" width="320" height="2400" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;style&gt;body{margin:8px;font-family:system-ui}&lt;/style&gt;&lt;div style=&quot;max-width:760px;margin:auto;line-height:1.8&quot;&gt;&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgZlnN-c9VM-RA4WIpaofF9JtBwVDRp9AobKhjMD3K1_OS02Xw4tt7LpVgL_RRm6bD36EkZ8PjqArsY-1U1osHQtA0TtoD8LKGpyCmyekip_5fbeNDahv0j3dz0SKtzG4q8k1oKJLQec-2YNcGk-SERttWLZBI_pvvboeOdbUGvt-EAK3CYDbcjGUJ-RTQ/s1600/clipboard.png&quot; alt=&quot;祭りのこだま太鼓。お手本のリズムを太鼓で返す構想イラスト&quot; style=&quot;width:100%;height:auto&quot; /&gt;&lt;/p&gt;&lt;p&gt;今回は、太鼓でリズムを返すゲームアイデアを発案し、タイミングを試せる小さな試遊を作りました。&lt;/p&gt;&lt;h2&gt;ドン、ドン。間を空けて、ドン。&lt;/h2&gt;&lt;p&gt;あなたは祭りの太鼓番。お手本の短いフレーズを見たら、今度は自分の番です。すぐ続けて叩くところと、ぐっと待つところ。同じボタンでも、間の取り方で演奏が変わります。&lt;/p&gt;&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjEtVy0aZgqMs9kEv0-nvsVy5UA7IMPMv_vIFU79vNMYPacY7X_tfyjQCgSWE742u5vBlYprGwqwDGSOhdqW6_zfmiIEdJtBRV2O0c7CdPlIIkGoIle45y-dPIyU8YfDL5oZKAaTDgnM278BAd8UAbSUu3aCWylZRlf4tDWMGGI_5XmtTiGIyd4bkkXpIY/s1600/clipboard.jpeg&quot; alt=&quot;見て覚える、間を待つ、叩いて返すという遊びの概念図&quot; style=&quot;width:100%;height:auto&quot; /&gt;&lt;/p&gt;&lt;p style=&quot;font-size:.9em;color:#666&quot;&gt;画像は構想イラストです。今回の試遊は音を鳴らさず、光る玉でリズムを表現します。本番にも玉のガイドがあるので、暗記だけに頼らず遊べます。&lt;/p&gt;&lt;h2&gt;太鼓を叩いてみる&lt;/h2&gt;&lt;iframe src=&quot;https://kicchomen.github.io/game-idea-lab/games/echo-drum/&quot; title=&quot;祭りのこだま太鼓の試遊&quot; width=&quot;100%&quot; height=&quot;1050&quot; style=&quot;display:block;width:100%;border:0;border-radius:12px&quot; loading=&quot;lazy&quot;&gt;&lt;/iframe&gt;&lt;p&gt;「祭りをはじめる」でお手本を見ます。自分の番になったら、玉が左の線に重なる瞬間に「ドン」をタップ。PCはSpaceでも叩けます。3節・全15打のうち12打成功を目指しましょう。見送りや空打ちが合計4回で終了。「もう一度演奏する」で再挑戦できます。&lt;/p&gt;&lt;p&gt;&lt;a href=&quot;https://kicchomen.github.io/game-idea-lab/games/echo-drum/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;▶ 試遊を別画面で開く&lt;/a&gt;&lt;/p&gt;&lt;h2&gt;今回試したところ、その先&lt;/h2&gt;&lt;p&gt;実装したのは、3つの固定リズムと、叩いたタイミングの判定です。構想では、仲間との掛け合いや自分で作るフレーズへ広げたいところ。音の演奏や自由な作曲は、まだ入っていません。&lt;/p&gt;&lt;p style=&quot;font-size:.9em;color:#666&quot;&gt;自動テストとブラウザ操作で検証。実機スマートフォン、人による初見テスト、長く遊んだときの手応えは未検証です。&lt;/p&gt;&lt;/div&gt;"></iframe></section><section><h2>360px</h2><iframe title="記事360px" width="360" height="2400" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;style&gt;body{margin:8px;font-family:system-ui}&lt;/style&gt;&lt;div style=&quot;max-width:760px;margin:auto;line-height:1.8&quot;&gt;&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgZlnN-c9VM-RA4WIpaofF9JtBwVDRp9AobKhjMD3K1_OS02Xw4tt7LpVgL_RRm6bD36EkZ8PjqArsY-1U1osHQtA0TtoD8LKGpyCmyekip_5fbeNDahv0j3dz0SKtzG4q8k1oKJLQec-2YNcGk-SERttWLZBI_pvvboeOdbUGvt-EAK3CYDbcjGUJ-RTQ/s1600/clipboard.png&quot; alt=&quot;祭りのこだま太鼓。お手本のリズムを太鼓で返す構想イラスト&quot; style=&quot;width:100%;height:auto&quot; /&gt;&lt;/p&gt;&lt;p&gt;今回は、太鼓でリズムを返すゲームアイデアを発案し、タイミングを試せる小さな試遊を作りました。&lt;/p&gt;&lt;h2&gt;ドン、ドン。間を空けて、ドン。&lt;/h2&gt;&lt;p&gt;あなたは祭りの太鼓番。お手本の短いフレーズを見たら、今度は自分の番です。すぐ続けて叩くところと、ぐっと待つところ。同じボタンでも、間の取り方で演奏が変わります。&lt;/p&gt;&lt;p&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjEtVy0aZgqMs9kEv0-nvsVy5UA7IMPMv_vIFU79vNMYPacY7X_tfyjQCgSWE742u5vBlYprGwqwDGSOhdqW6_zfmiIEdJtBRV2O0c7CdPlIIkGoIle45y-dPIyU8YfDL5oZKAaTDgnM278BAd8UAbSUu3aCWylZRlf4tDWMGGI_5XmtTiGIyd4bkkXpIY/s1600/clipboard.jpeg&quot; alt=&quot;見て覚える、間を待つ、叩いて返すという遊びの概念図&quot; style=&quot;width:100%;height:auto&quot; /&gt;&lt;/p&gt;&lt;p style=&q
