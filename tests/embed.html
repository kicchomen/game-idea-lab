<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>センサーずらし：埋め込み表示テスト</title><style>body{font-family:system-ui;margin:24px;background:#e4edf3;color:#17364d}button{padding:12px;margin:4px;font:inherit}iframe{display:block;width:500px;max-width:100%;height:1040px;border:1px solid #b4cad7;margin-top:16px;background:white}a{color:#086caa}</style></head><body><h1>埋め込み表示テスト</h1><p>同じゲームをスマホ幅・PC幅で試せます。端末そのものの検証ではありません。</p><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="500">500px</button><p id="size" role="status">幅 500px</p><a href="../games/sensor-shift/">単独で開く</a><iframe src="../games/sensor-shift/" title="センサーずらしを試遊"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelector('#size').textContent='幅 '+b.dataset.width+'px'});</script></body></html>
