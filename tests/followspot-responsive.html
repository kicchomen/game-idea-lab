<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光の舞台係 viewport QA</title><style>body{font:14px system-ui;background:#ebe5de;color:#33242d;margin:16px}h1{font-size:22px}section{display:inline-block;vertical-align:top;margin:0 18px 24px 0}iframe{display:block;border:0;outline:2px solid #6a4c5a}button{min-height:44px;padding:8px 16px}pre{white-space:pre-wrap}</style><h1>光の舞台係: 実操作用の表示領域</h1><p>各iframeの中で開始・追跡・消灯・停止・成功/失敗・再挑戦を確認する。親の検査ページだけは縦スクロールする。ゲーム状態の注入や自動操作はしない。</p><button id="measure">表示領域とボタンを測る</button><pre id="report" aria-live="polite"></pre>
<section><h2>320 × 568</h2><iframe src="../games/followspot/" width="320" height="568" title="光の舞台係 320 × 568"></iframe></section>
<section><h2>360 × 640</h2><iframe src="../games/followspot/" width="360" height="640" title="光の舞台係 360 × 640"></iframe></section>
<section><h2>390 × 844</h2><iframe src="../games/followspot/" width="390" height="844" title="光の舞台係 390 × 844"></iframe></section>
<section><h2>記事内 258 × 568</h2><iframe src="../games/followspot/" width="258" height="568" title="光の舞台係 記事内 258 × 568"></iframe></section>
<section><h2>横画面 667 × 375</h2><iframe src="../games/followspot/" width="667" height="375" title="光の舞台係 横画面 667 × 375"></iframe></section>
<script>document.getElementById('measure').onclick=()=>{document.getElementById('report').textContent=JSON.stringify([...document.querySelectorAll('iframe')].map(frame=>{const d=frame.contentDocument,w=frame.contentWindow;return{title:frame.title,viewport:[w.innerWidth,w.innerHeight],document:[d.documentElement.scrollWidth,d.documentElement.scrollHeight],controls:[...d.querySelectorAll('button')].filter(b=>{const r=b.getBoundingClientRect();return r.width&&r.height}).map(b=>{const r=b.getBoundingClientRect();return{id:b.id,width:Math.round(r.width*10)/10,height:Math.round(r.height*10)/10,inside:r.x>=0&&r.y>=0&&r.right<=w.innerWidth+.1&&r.bottom<=w.innerHeight+.1}})}}),null,2)};</script></html>
