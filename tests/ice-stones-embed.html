<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ice Stones responsive QA</title><style>body{font-family:system-ui;margin:16px;background:#ddd}button{min-height:44px;margin:4px}iframe{display:block;border:0;background:white;margin-top:12px;height:850px}#report{white-space:pre-wrap}</style><h1>表示・操作の検証</h1><p>実ブラウザーのiframe幅。実機スマートフォンの検査ではありません。</p><button data-w="320">320px</button><button data-w="360">360px</button><button data-w="390">390px</button><button data-mode="game">試遊</button><button data-mode="article">保存記事本文</button><button id="measure">幅を測る</button><pre id="report"></pre><iframe id="frame" width="320" src="../games/ice-stones/?v=20261026-final2" title="幅別検証"></iframe><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;document.querySelector('#report').textContent='iframe width '+f.width;});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{f.src=b.dataset.mode==='game'?'../games/ice-stones/?v=20261026-final2':'../assets/ice-stones/article-preview.html?v=20261026-final2';});document.querySelector('#measure').onclick=()=>{try{const d=f.contentDocument;document.querySelector('#report').textContent=JSON.stringify({frame:f.getBoundingClientRect().width,client:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,buttons:[...d.querySelectorAll('button')].filter(b=>!b.hidden).map(b=>({text:b.textContent,width:b.getBoundingClientRect().width,height:b.getBoundingClientRect().height}))},null,2);}catch(e){document.querySelector('#report').textContent='cross-origin; inspect visible page';}};</script></html>
