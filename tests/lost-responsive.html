<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>忘れ物窓口の探偵・表示検証</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px}iframe{display:block;border:0;width:320px;height:1350px;background:white}</style><header><label>表示幅 <select id="width"><option>320</option><option>360</option><option>390</option><option>703</option></select></label><label>対象 <select id="target"><option value="../games/lost-property/">試遊</option><option value="lost-article.html">記事本文</option></select></label><label>公開記事URL <input id="url" type="url"></label><button id="open">記事を検査</button></header><iframe title="幅を変えて試遊" src="../games/lost-property/"></iframe><script>const frame=document.querySelector('iframe');document.getElementById('width').onchange=function(){frame.style.width=this.value+'px'};document.getElementById('target').onchange=function(){frame.src=this.value};document.getElementById('open').onclick=function(){try{const u=new URL(document.getElementById('url').value);if(u.protocol==='https:'&&u.hostname==='game-idea-lab.blogspot.com')frame.src=u.href}catch{}}</script></html>
