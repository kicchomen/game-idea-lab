<!doctype html><html lang="ja"><meta charset="utf-8"><title>保存済み記事本文の幅別QA</title><h1>保存済み記事本文の幅別QA</h1><h2>320px</h2><iframe id="a320" title="記事320px" style="width:320px;height:3600px;border:0" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;ja&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width&quot;&gt;&lt;style&gt;body{margin:0;padding:16px;font:16px/1.7 system-ui;overflow-wrap:anywhere}h2{font-size:1.3em}&lt;/style&gt;&lt;body&gt;&lt;p&gt;新しいゲームアイデアを発案し、探索の核を小さな試遊にしました。&lt;/p&gt;
&lt;figure style=&quot;margin:0 0 1em&quot;&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgwE19rS-mvHLz4Por2djiGnmJUFd9_BNScTg7_YfJahKTeMWcVhXd-YgDDQHSe4UG5Bhkd5Buljk1xkRvCndOZPD_FK2esQAqFoPI4_jx2xd2NTuF_evZapDRpO9qBGHNIBiO01QMS3QlS-yKiEK00j7K0i63w2vjiDOv1dKMv-r8FCkH9cN7LdSNqdds/s1600/clipboard.jpeg&quot; width=&quot;1439&quot; height=&quot;810&quot; alt=&quot;霧に包まれた島で、地図師が野営地から枝分かれした道を見渡す構想イラスト&quot; style=&quot;display:block;width:100%;max-width:100%;height:auto&quot;&gt;&lt;figcaption style=&quot;font-size:.85em;color:#666&quot;&gt;ゲームの構想イラスト。実際の試遊画面とは異なります。&lt;/figcaption&gt;&lt;/figure&gt;
&lt;h2&gt;まだ白紙の地図を、一歩ずつ。&lt;/h2&gt;
&lt;p&gt;霧の島へ渡った地図師。目指すのは、&lt;strong&gt;名所を2か所訪ねて野営地へ戻ること&lt;/strong&gt;です。&lt;/p&gt;
&lt;p&gt;歩けば近くの地形がわかります。でも、その先が岩でふさがっていたら？ &lt;strong&gt;昼を2使って遠くを見渡すか、まず歩いて確かめるか。&lt;/strong&gt;知るための時間と、帰るための時間を同じ残りの昼から使います。&lt;/p&gt;
&lt;figure style=&quot;margin:1em 0;text-align:center&quot;&gt;&lt;img src=&quot;https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg37JddsdBG7pv-VjRBhtewZJDkWYRGVktNf_nfFhoiw9MX0VRiBBO4Yu3tCZ6mMDO5wniYiY5WycXmtByGkFiQj9J3BypTtQiPUZVADF1W-vflkvXFHf89Vx0NzPAY1TfSxIJbyoYpUSo2ssvl6rsO4lFuFyUSnt6bJJQvlppLZIJwJHDE5pWtafXNbgQ/s1600/clipboard.jpeg&quot; width=&quot;501&quot; height=&quot;954&quot; loading=&quot;lazy&quot; alt=&quot;実際の試遊画面。見渡してから北へ歩き、1つめの名所を記録。残りの昼18、判明した帰り道は昼2&quot; style=&quot;display:block;width:360px;max-width:100%;height:auto;margin:auto&quot;&gt;&lt;figcaption style=&quot;font-size:.85em;color:#666&quot;&gt;今回の試作画面。霧が晴れた範囲と、歩いた道が地図に残ります。&lt;/figcaption&gt;&lt;/figure&gt;
&lt;h2&gt;先を知ることにも、値段がある。&lt;/h2&gt;
&lt;p&gt;森は平地より歩くのに時間がかかります。見つけた名所へ直行するか、軽い道を探すか。地図に出る「帰還に必要な昼」は、&lt;strong&gt;判明した道だけで計算する目安&lt;/strong&gt;。まだ見えていない近道までは教えてくれません。&lt;/p&gt;
&lt;h2&gt;霧の島を、歩いてみる。&lt;/h2&gt;
&lt;iframe src=&quot;https://kicchomen.github.io/game-idea-lab/games/mist-cartographer/&quot; title=&quot;霧の島の地図師を試遊&quot; width=&quot;100%&quot; height=&quot;1000&quot; loading=&quot;lazy&quot; style=&quot;display:block;border:1px solid #a1b193;border-radius:12px;max-width:100%;box-sizing:border-box&quot; allowfullscreen&gt;&lt;/iframe&gt;
&lt;p&gt;&lt;a href=&quot;https://kicchomen.github.io/game-idea-lab/games/mist-cartographer/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;▶ 大きな画面で試遊する&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;操作：&lt;/strong&gt;方向ボタンか矢印キーで移動。「見渡す」は昼2で周辺を広く調査します。名所2か所を実際に訪ね、左下の野営地で「調査を終える」を押せば成功。&lt;/p&gt;
&lt;p&gt;平地は昼1、森は昼2。名所2か所を訪ねていれば、残り0ちょうどの帰還も成功。野営地の外で0になると失敗です。&lt;strong&gt;考えている間は時間が進みません。&lt;/strong&gt;&lt;/p&gt;
&lt;h2&gt;今回の試作と、その先&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;実装したもの：&lt;/strong&gt;固定3島の霧・地形調査、移動費用、名所の記録、帰還、成功／失敗と再挑戦。&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;この先の構想：&lt;/strong&gt;持ち帰った地図を次の探検隊に渡す、天候で通れる道が変わる、といった「得た情報が誰かの旅を変える」方向へ広げたいと考えています。これらはまだ実装していません。&lt;/p&gt;
&lt;p style=&quot;font-size:.9em;color:#666&quot;&gt;固定の島なので道を覚えると簡単になります。計算・操作の自動検査とクラウドPCでの操作確認を行いました。実機スマホ、初見の人の理解・面白さ、長く遊べる深さは未検証です。&lt;/p&gt;
