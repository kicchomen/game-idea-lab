&lt;p&gt;&lt;strong&gt;今回試せる範囲：&lt;/strong&gt;固定配置の牧場1つと、犬から離れながら群れる羊。犬は柵を越えられる簡略モデルです。地形や羊の個性、広い牧場は今後の構想で、未実装です。&lt;/p&gt;
