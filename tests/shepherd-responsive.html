<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>丘の牧羊犬 / iframe幅チェック</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#edf0e5;margin:0;padding:12px;color:#203a33}h1{font-size:20px;margin:4px 0 8px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;min-height:44px;padding:10px;border-radius:8px;border:1px solid #8b9b80;background:#fff;color:#203a33}button[aria-pressed=true]{background:#285c45;color:white}p{font-size:14px}iframe{display:block;width:320px;height:930px;border:0;background:white;max-width:none}.frame-wrap{width:max-content;outline:1px solid #aab79d}small{display:block;max-width:650px;line-height:1.6;margin:8px 0}</style></head><body><h1>丘の牧羊犬 / 通常iframeの幅チェック</h1><nav aria-label="iframeの幅"><button data-width="320" aria-pressed="true">320px</button><button data-width="360" aria-pressed="false">360px</button><button data-width="390" aria-pressed="false">390px</button><a href="../games/shepherd-circle/" target="_blank" rel="noopener">単体で開く</a></nav><p id="label" role="status">表示中：320 CSS px。幅を変えてもゲーム状態はリセットしません。</p><small>ブラウザ内の通常iframeです。実機スマートフォンの検証ではありません。外側の幅ボタンへ移ると、ゲームはフォーカス喪失で一時停止することがあります。ゲーム内の「つづける」で再開してください。</small><div class="frame-wrap"><iframe id="game" src="../games/shepherd-circle/?qa=20261023-2" title="丘の牧羊犬を320 CSS pxで試遊"></iframe></div><script>document.querySelectorAll('[data-width]').forEach(function(button){button.addEventListener('click',function(){var width=button.dataset.width;document.getElementById('game').style.width=width+'px';document.getElementById('game').title='丘の牧羊犬を'+width+' CSS pxで試遊';document.getElementById('label').textContent='表示中：'+width+' CSS px。幅を変えてもゲーム状態はリセットしません。';document.querySelectorAll('[data-width]').forEach(function(b){b.setAttribute('aria-pressed',String(b===button));});});});</script></body></html>
